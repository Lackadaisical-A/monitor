name: Configure and submit App Store release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release action
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - configure
          - submit
      build_number:
        description: Processed App Store build number
        required: true
        default: "2"
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_APP_ID: "6803988538"
      ASC_APP_VERSION: "1.0"
      ASC_BUILD_NUMBER: ${{ inputs.build_number }}
      ASC_PRODUCT_IDS: com.yingcui.CatalystWatch.pro.monthly,com.yingcui.CatalystWatch.pro.yearly
      ASC_REVIEW_SCREENSHOT: ios/AppStore/Screenshots/catalyst-watch-paywall-6.5.png
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run App Store release action
        run: node scripts/app-store-release.mjs "${{ inputs.action }}"
