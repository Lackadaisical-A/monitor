name: Distribute uploaded Academy build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Existing uploaded Academy build number
        required: true
        type: string
      app_version:
        description: Existing app version
        default: "2.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-distribution
  cancel-in-progress: false

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_APP_ID: "6803988538"
      ASC_APP_VERSION: ${{ inputs.app_version }}
      ASC_BUILD_NUMBER: ${{ inputs.build_number }}
      ASC_TESTFLIGHT_NOTES: >-
        Academy shared workspace on Render. Sign in with your private instructor ID
        and access code to sync the academy roster. Link a blank writable NDEF tag
        as an instructor card, then use Tap instructor card on another iPhone.
        Lost cards can be revoked. Test offline edits, conflict review, Onshape
        lessons, projects, homework, and assessments. The public demo uses fictional
        students; real academy records require staff credentials. NFC needs a physical iPhone.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare internal testing
        env:
          ASC_TESTFLIGHT_ACTION: internal
          ASC_TESTFLIGHT_GROUP_IDS: c11d1b5a-c0d6-4475-b182-0b6b471557c0
        run: node scripts/testflight.mjs
      - name: Update Academy beta description
        run: node scripts/academy-testflight-metadata.mjs
      - name: Prepare existing public testing group
        env:
          ASC_TESTFLIGHT_ACTION: prepare
          ASC_TESTFLIGHT_GROUP_IDS: da77ab8e-eec5-44cb-bc54-de9e390de3bc
        run: node scripts/testflight.mjs
