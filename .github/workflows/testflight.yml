name: Manage TestFlight build

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, prepare for external testing, or notify testers
        required: true
        default: inspect
        type: choice
        options: [inspect, prepare, internal, notify, academy]
      build_number:
        description: Uploaded iOS build number
        required: true
        type: string
      app_version:
        description: Uploaded app version
        required: false
        default: "2.1"
        type: string
      group_ids:
        description: Existing external tester group IDs, comma separated (prepare only)
        required: false
        type: string
      test_notes:
        description: What to Test in English (prepare only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-distribution
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_APP_ID: "6803988538"
      ASC_APP_VERSION: ${{ inputs.app_version || '2.1' }}
      ASC_BUILD_NUMBER: ${{ inputs.build_number }}
      ASC_TESTFLIGHT_ACTION: ${{ inputs.action }}
      ASC_TESTFLIGHT_GROUP_IDS: ${{ inputs.group_ids }}
      ASC_TESTFLIGHT_NOTES: ${{ inputs.test_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Manage selected TestFlight build
        if: inputs.action != 'academy'
        run: node scripts/testflight.mjs
      - name: Prepare Academy internal testing
        if: inputs.action == 'academy'
        env:
          ASC_TESTFLIGHT_ACTION: internal
          ASC_TESTFLIGHT_GROUP_IDS: c11d1b5a-c0d6-4475-b182-0b6b471557c0
          ASC_TESTFLIGHT_NOTES: >-
            Academy shared workspace on Render. Sign in with your private instructor
            ID and code to sync the academy roster. Link a blank writable NDEF tag as
            your instructor card, then tap it to sign in on another iPhone. Test
            offline edits, conflict review, Onshape lessons, projects, homework,
            and assessments. Test dated class logbooks, camera/photos, private family links,
            and instructor hours. Clock-in requires an accurate location within 100 feet
            of 118 Ferry Street, Jersey City. Check weekly totals, team hours, corrections,
            and entrance calibration. Camera, real location clock-in, and NFC require a physical iPhone.
        run: node scripts/testflight.mjs
      - name: Update Academy beta description
        if: inputs.action == 'academy'
        run: node scripts/academy-testflight-metadata.mjs
      - name: Prepare Academy public testing
        if: inputs.action == 'academy'
        env:
          ASC_TESTFLIGHT_ACTION: prepare
          ASC_TESTFLIGHT_GROUP_IDS: da77ab8e-eec5-44cb-bc54-de9e390de3bc
          ASC_TESTFLIGHT_NOTES: >-
            Academy shared workspace with private instructor access codes and NFC
            instructor cards. Explore Onshape lessons, projects, homework, goals,
            and assessments in the public demo. Real academy records require staff
            credentials. Test dated class logbooks, photo attachments, revocable family
            links, and instructor hours. Staff clock-in checks a 100-foot radius at
            118 Ferry Street, Jersey City. Demo mode records no work hours. Camera,
            real location checks, and NFC require physical devices.
        run: node scripts/testflight.mjs
