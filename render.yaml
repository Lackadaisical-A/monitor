services:
  - type: web
    name: catalyst-watch
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    numInstances: 1
    disk:
      name: catalyst-watch-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /app/data/biotech-signal.db
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: ALPACA_MARKET_DATA_SCOPE
        value: developer
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ALPACA_DATA_FEED
        value: iex
      - key: ALPACA_NEWS_ENABLED
        value: true
      - key: SCAN_INTERVAL_SECONDS
        value: 60
      - key: FDA_ADCOM_ENABLED
        value: true
      - key: FREE_FEED_DELAY_MINUTES
        value: 30
      - key: APP_STORE_BUNDLE_ID
        value: com.yingcui.CatalystWatch
      - key: APP_STORE_APP_ID
        value: 6803988538
      - key: APP_STORE_PRODUCT_IDS
        value: com.yingcui.CatalystWatch.pro.monthly,com.yingcui.CatalystWatch.pro.yearly
      - key: APPLE_ROOT_CA_DIR
        value: /app/config/apple
      - key: ALERT_DRY_RUN
        value: false
      - key: ALERT_HIGH_MIN_MATERIALITY
        value: 70
      - key: ALERT_HIGH_MIN_CONFIDENCE
        value: 0.8
      - key: ALERT_MAX_AGE_MINUTES
        value: 30
      - key: ANALYSIS_CONCURRENCY
        value: 4
      - key: ANALYSIS_BATCH_SIZE
        value: 100
      - key: ANALYSIS_HISTORY_DAYS
        value: 180
      - key: DISCOVERY_SLO_SECONDS
        value: 120
      - key: ANALYSIS_SLO_SECONDS
        value: 45
      - key: PUSH_SLO_SECONDS
        value: 180
      - key: OUTCOME_AUDIT_INTERVAL_MINUTES
        value: 15
      - key: OUTCOME_AUDIT_BATCH_SIZE
        value: 30
      - key: APNS_TEAM_ID
        value: C2Y2PKW3VD
      - key: APNS_KEY_ID
        value: SMAGF593N6
      - key: APNS_BUNDLE_ID
        value: com.yingcui.CatalystWatch
      - key: APNS_ENVIRONMENT
        value: production
      - key: APNS_ALLOW_CRITICAL
        value: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHBOARD_TOKEN
        sync: false
      - key: DEVELOPER_PAIRING_TOKEN
        sync: false
      - key: CLUB_DATA_KEY
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_SHEET_ID
        value: 0
      - key: GOOGLE_SHEETS_SHEET_TITLE
        value: Attendance
      - key: GOOGLE_SHEETS_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SHEETS_PRIVATE_KEY
        sync: false
      - key: GOOGLE_SHEETS_TIME_ZONE
        value: America/New_York
      - key: GOOGLE_SHEETS_SYNC_INTERVAL_SECONDS
        value: 300
      - key: SEC_USER_AGENT
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
