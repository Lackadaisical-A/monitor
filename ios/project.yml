name: BiotechSignal
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  BiotechSignal:
    type: application
    platform: iOS
    sources:
      - path: BiotechSignal
    info:
      path: BiotechSignal/Info.plist
    entitlements:
      path: BiotechSignal/BiotechSignal.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BiotechSignal
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
schemes:
  BiotechSignal:
    build:
      targets:
        BiotechSignal: all
    run:
      config: Debug
    archive:
      config: Release
