name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify buyback execution and frozen strategy
        run: |
          python3 -m venv .venv-buyback
          .venv-buyback/bin/python -m pip install -r buyback/requirements.txt
          .venv-buyback/bin/python -m unittest discover -s buyback -p 'test_*.py' -v
          .venv-buyback/bin/python buyback/worker.py --self-check
