name: Upload iOS build

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store build number (defaults to the workflow run number)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_BUNDLE_ID: com.yingcui.CatalystWatch
      ASC_PROFILE_NAME: Catalyst Watch App Store NFC
      IOS_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing credentials
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          CERTIFICATE_SERIAL="$(security find-certificate -a -p "$KEYCHAIN_PATH" | openssl x509 -noout -serial | cut -d= -f2)"
          test -n "$CERTIFICATE_SERIAL"
          printf 'ASC_CERTIFICATE_SERIAL=%s\n' "$CERTIFICATE_SERIAL" >> "$GITHUB_ENV"

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml

      - name: Provision NFC distribution profile
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/CatalystWatchNFC.mobileprovision"
          PROFILE_METADATA="$RUNNER_TEMP/CatalystWatchNFC.json"
          ASC_PROFILE_PATH="$PROFILE_PATH" node scripts/apple-provision-profile.mjs | tee "$PROFILE_METADATA"

          PROFILE_UUID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)"
          PROFILE_DIRECTORY="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIRECTORY"
          cp "$PROFILE_PATH" "$PROFILE_DIRECTORY/$PROFILE_UUID.mobileprovision"

          PROFILE_PLIST="$RUNNER_TEMP/provisioned-profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NFC_FORMATS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.nfc.readersession.formats' "$PROFILE_PLIST")"
          printf 'Provisioned profile NFC formats:\n%s\n' "$PROFILE_NFC_FORMATS"
          printf '%s\n' "$PROFILE_NFC_FORMATS" | grep -q TAG

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/ExportOptions.plist "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$ASC_BUNDLE_ID $ASC_PROFILE_NAME" "$EXPORT_OPTIONS"
          printf 'ASC_EXPORT_OPTIONS=%s\n' "$EXPORT_OPTIONS" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/BiotechSignal.xcodeproj \
            -scheme BiotechSignal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/CatalystWatch.xcarchive" \
            CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            PROVISIONING_PROFILE_SPECIFIER="$ASC_PROFILE_NAME" \
            clean archive

      - name: Verify bundle version
        run: |
          set -euo pipefail
          APP_PLIST="$RUNNER_TEMP/CatalystWatch.xcarchive/Products/Applications/BiotechSignal.app/Info.plist"
          ACTUAL_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PLIST")"
          test "$ACTUAL_BUILD_NUMBER" = "$IOS_BUILD_NUMBER"

      - name: Verify NFC signing entitlement
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/CatalystWatch.xcarchive/Products/Applications/BiotechSignal.app"
          SIGNED_ENTITLEMENTS="$RUNNER_TEMP/signed-entitlements.plist"
          PROFILE_PLIST="$RUNNER_TEMP/embedded-profile.plist"
          codesign -d --entitlements :- "$APP_PATH" > "$SIGNED_ENTITLEMENTS" 2>/dev/null
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$PROFILE_PLIST"
          SIGNED_NFC_FORMATS="$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.formats' "$SIGNED_ENTITLEMENTS")"
          PROFILE_NFC_FORMATS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.nfc.readersession.formats' "$PROFILE_PLIST")"
          printf 'Signed app NFC formats:\n%s\nEmbedded profile NFC formats:\n%s\n' "$SIGNED_NFC_FORMATS" "$PROFILE_NFC_FORMATS"
          printf '%s\n' "$SIGNED_NFC_FORMATS" | grep -q TAG
          printf '%s\n' "$PROFILE_NFC_FORMATS" | grep -q TAG

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/CatalystWatch.xcarchive" \
            -exportOptionsPlist "$ASC_EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Validate and upload
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/export" -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --validate-app --file "$IPA_PATH" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --file "$IPA_PATH" --type ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf "$HOME/.appstoreconnect/private_keys"
