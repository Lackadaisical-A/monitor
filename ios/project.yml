name: BiotechSignal
options:
  bundleIdPrefix: com.yingcui
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C2Y2PKW3VD
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  BiotechSignal:
    type: application
    platform: iOS
    sources:
      - path: BiotechSignal
    info:
      path: BiotechSignal/Info.plist
      properties:
        CFBundleDisplayName: Catalyst Watch
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.yingcui.CatalystWatch
            CFBundleURLSchemes:
              - catalystwatch
        ITSAppUsesNonExemptEncryption: false
        CatalystWatchServerURL: https://catalyst-watch.onrender.com
        LSApplicationCategoryType: public.app-category.finance
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: BiotechSignal/BiotechSignal.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingcui.CatalystWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Catalyst Watch App Store
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.Push:
          enabled: 1
schemes:
  BiotechSignal:
    build:
      targets:
        BiotechSignal: all
    run:
      config: Debug
      storeKitConfiguration: CatalystWatch.storekit
    archive:
      config: Release
