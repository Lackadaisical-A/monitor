name: Configure and inspect Academy App Store release

on:
  push:
    branches: [codex/academy-instructor-2-1]
    paths:
      - ios/AppStore/academy-en-US.json
      - scripts/academy-app-store.mjs
      - .github/workflows/app-store-release.yml
  workflow_dispatch:
    inputs:
      action:
        description: Inspect the app or configure its editable academy listing
        type: choice
        options: [inspect, configure]
        default: inspect
        required: true
      build_number:
        description: Processed academy build number
        type: string
        default: "22"
        required: true

permissions:
  contents: read

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate academy metadata
        run: node scripts/academy-app-store.mjs validate
      - name: Prepare the academy release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_BUILD_NUMBER: ${{ inputs.build_number || '22' }}
        run: node scripts/academy-app-store.mjs "${{ inputs.action || 'inspect' }}"
