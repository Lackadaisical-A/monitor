name: BiotechSignal
options:
  bundleIdPrefix: com.yingcui
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "18"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C2Y2PKW3VD
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  BiotechSignal:
    type: application
    platform: iOS
    sources:
      - path: BiotechSignal/Academy
      - path: BiotechSignal/Assets.xcassets
      - path: BiotechSignal/BiotechSignalApp.swift
      - path: BiotechSignal/ClubCardReader.swift
      - path: BiotechSignal/KeychainStore.swift
      - path: BiotechSignal/PrivacyInfo.xcprivacy
    info:
      path: BiotechSignal/Info.plist
      properties:
        CFBundleDisplayName: Flight Academy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.yingcui.CatalystWatch
            CFBundleURLSchemes:
              - flightacademy
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        NFCReaderUsageDescription: Flight Academy reads student NFC passports to open their learning record and verify instructor checkride sign-offs.
        NSFaceIDUsageDescription: Authorize instructor checkride sign-offs and NFC passport linking.
        UIAppFonts:
          - B612-Regular.ttf
          - B612-Bold.ttf
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: BiotechSignal/BiotechSignal.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats:
          - TAG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yingcui.CatalystWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE_SPECIFIER: Catalyst Watch App Store
    attributes:
      SystemCapabilities:
        com.apple.NearFieldCommunicationTagReading:
          enabled: 1
  AcademyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AcademyTests
    dependencies:
      - target: BiotechSignal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BiotechSignal:
    build:
      targets:
        BiotechSignal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AcademyTests
    archive:
      config: Release
