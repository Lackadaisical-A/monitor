name: Manage TestFlight build

on:
  workflow_dispatch:
    inputs:
      action:
        description: Inspect, prepare for external testing, or notify testers
        required: true
        default: inspect
        type: choice
        options: [inspect, prepare, notify]
      build_number:
        description: Uploaded iOS build number
        required: true
        type: string
      group_ids:
        description: Existing external tester group IDs, comma separated (prepare only)
        required: false
        type: string
      test_notes:
        description: What to Test in English (prepare only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-distribution
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_APP_ID: "6803988538"
      ASC_APP_VERSION: "1.0"
      ASC_BUILD_NUMBER: ${{ inputs.build_number }}
      ASC_TESTFLIGHT_ACTION: ${{ inputs.action }}
      ASC_TESTFLIGHT_GROUP_IDS: ${{ inputs.group_ids }}
      ASC_TESTFLIGHT_NOTES: ${{ inputs.test_notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Manage selected TestFlight build
        run: node scripts/testflight.mjs
